name: Build Linux versions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.0.0', '1.0.1']
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-tools
      - uses: actions/checkout@v4
        with:
          ref: v${{ matrix.version }}
          path: release-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release-source/package-lock.json
      - run: npm ci
        working-directory: release-source
      - name: Build AppImage and Debian packages from the version's original source
        run: node build-tools/scripts/build-linux-release.mjs release-source
      - name: Verify package version and shared app files
        run: node build-tools/scripts/verify-linux-bundle.mjs release-source
      - name: Launch the packaged app in a virtual display
        shell: bash
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/link-config-${{ matrix.version }}
        run: |
          set +e
          timeout --kill-after=5s 15s xvfb-run -a ./release-source/dist/linux-unpacked/link --no-sandbox --disable-gpu > "$RUNNER_TEMP/link-smoke.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/link-smoke.log"
          test "$result" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: link-Linux-${{ matrix.version }}
          path: |
            release-source/dist/*.AppImage
            release-source/dist/*.deb
            release-source/dist/latest*.yml
          if-no-files-found: error
      - name: Add Linux downloads to the matching release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v${{ matrix.version }} release-source/dist/*.AppImage release-source/dist/*.deb release-source/dist/latest-linux.yml --repo "${{ github.repository }}" --clobber
